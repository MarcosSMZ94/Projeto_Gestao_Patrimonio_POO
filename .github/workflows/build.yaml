name: Build and Publish

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release version'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:

    runs-on: windows-2025
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        sparse-checkout: |
          SistemaPatrimonio
          .github

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Create warp-packer directory
      run: |
        mkdir SistemaPatrimonio\tools

    - name: Set up warp-packer
      run: |
        [Net.ServicePointManager]::SecurityProtocol = "tls12, tls11, tls"
        Invoke-WebRequest https://github.com/dgiagio/warp/releases/download/v0.3.0/windows-x64.warp-packer.exe -OutFile SistemaPatrimonio\tools\warp-packer.exe
      shell: pwsh

    - name: Build
      run: |
        cd SistemaPatrimonio
        mvn clean package

    - name: Publish
      if: ${{ github.event.inputs.release == 'true' }}
      uses: svenstaro/upload-release-action@2.11.2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: SistemaPatrimonio/target/SistemaPatrimonio.exe
        asset_name: SistemaPatrimonio.exe
        tag: v1.0.0
        release_name: Sistema Patrimônio 
        make_latest: true
        body: |
          ## Changelog
          - Initial release



